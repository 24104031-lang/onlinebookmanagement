<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Checkout — BookVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<th:block th:replace="~{layout :: navbar}"/>

<div class="page-wrap">
  <div class="page-header">
    <h1 class="page-title">Checkout</h1>
  </div>

  <div class="checkout-layout">
    <!-- Order review -->
    <div class="checkout-items">
      <h2 class="section-title">Order Review</h2>
      <div th:each="item : ${cartItems}" class="checkout-item-row">
        <div class="checkout-book-info">
          <span class="checkout-book-title" th:text="${item.title}"></span>
          <span class="checkout-book-author" th:text="${item.author}"></span>
        </div>
        <div class="checkout-qty">× <span th:text="${item.quantity}"></span></div>
        <div class="checkout-price" th:text="'$' + #numbers.formatDecimal(item.subtotal, 1, 2)"></div>
      </div>
      <div class="checkout-total-row">
        <span>Total</span>
        <span class="checkout-total-val" th:text="'$' + #numbers.formatDecimal(cartTotal, 1, 2)"></span>
      </div>
    </div>

    <!-- Payment -->
    <div class="payment-panel">
      <h2 class="section-title">Payment Method</h2>
      <form th:action="@{/cart/checkout}" method="post" class="payment-form">
        <label class="payment-option">
          <input type="radio" name="paymentMethod" value="Credit Card" checked/>
          <div class="payment-option-body">
            <span class="pay-icon">💳</span>
            <div>
              <div class="pay-name">Credit Card</div>
              <div class="pay-desc">Visa, MasterCard, Amex</div>
            </div>
          </div>
        </label>
        <label class="payment-option">
          <input type="radio" name="paymentMethod" value="UPI"/>
          <div class="payment-option-body">
            <span class="pay-icon">📱</span>
            <div>
              <div class="pay-name">UPI</div>
              <div class="pay-desc">Pay via UPI ID instantly</div>
            </div>
          </div>
        </label>
        <label class="payment-option">
          <input type="radio" name="paymentMethod" value="Cash on Delivery"/>
          <div class="payment-option-body">
            <span class="pay-icon">💵</span>
            <div>
              <div class="pay-name">Cash on Delivery</div>
              <div class="pay-desc">Pay when you receive</div>
            </div>
          </div>
        </label>

        <div class="checkout-summary-box">
          <div class="summary-row">
            <span>Order Total</span>
            <span th:text="'$' + #numbers.formatDecimal(cartTotal, 1, 2)"></span>
          </div>
          <div class="summary-row">
            <span>Delivery</span>
            <span class="text-green">Free</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">Place Order</button>
        <a th:href="@{/cart}" class="btn btn-ghost btn-full" style="margin-top:.5rem;">← Back to Cart</a>
      </form>
    </div>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
