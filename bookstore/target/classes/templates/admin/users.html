<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Users — BookVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<th:block th:replace="~{layout :: navbar}"/>
<div class="page-wrap">
  <div class="page-header">
    <h1 class="page-title">All Users</h1>
    <p class="page-sub" th:text="${users.size()} + ' registered users'"></p>
  </div>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="user : ${users}">
          <td class="mono" th:text="${user.userId}"></td>
          <td th:text="${user.name}"></td>
          <td>
            <span class="badge"
                  th:classappend="${user.role == 'admin' ? ' badge-red' : ' badge-blue'}"
                  th:text="${user.role}"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
