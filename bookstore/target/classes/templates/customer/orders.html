<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>My Orders — BookVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<th:block th:replace="~{layout :: navbar}"/>

<div class="page-wrap">
  <div class="page-header">
    <h1 class="page-title">My Orders</h1>
    <p class="page-sub" th:text="${orders.size()} + ' order(s)'"></p>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

  <div th:each="order : ${orders}" class="order-card">
    <div class="order-head">
      <div class="order-meta">
        <span class="order-id mono" th:text="${order.orderId}"></span>
        <span class="badge"
              th:classappend="${order.status == 'Completed' or order.status == 'Delivered' ? ' badge-green' : order.status == 'Shipped' ? ' badge-blue' : order.status == 'Cancelled' ? ' badge-red' : ' badge-yellow'}"
              th:text="${order.status}"></span>
      </div>
      <div class="order-info-row">
        <span>💳 <span th:text="${order.paymentMethod}"></span></span>
        <span>📅 <span th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'dd MMM yyyy HH:mm') : 'N/A'}"></span></span>
        <span class="order-total">Total: $<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></span>
      </div>
    </div>

    <!-- Tracking bar -->
    <div class="tracking-bar">
      <div class="track-step" th:classappend="${#lists.contains({'Completed','Processing','Shipped','Delivered','Pending'}, order.status) ? ' done' : ''}">
        <div class="track-dot"></div><div class="track-label">Ordered</div>
      </div>
      <div class="track-line"></div>
      <div class="track-step" th:classappend="${#lists.contains({'Processing','Shipped','Delivered','Completed'}, order.status) ? ' done' : ''}">
        <div class="track-dot"></div><div class="track-label">Processing</div>
      </div>
      <div class="track-line"></div>
      <div class="track-step" th:classappend="${#lists.contains({'Shipped','Delivered'}, order.status) ? ' done' : ''}">
        <div class="track-dot"></div><div class="track-label">Shipped</div>
      </div>
      <div class="track-line"></div>
      <div class="track-step" th:classappend="${order.status == 'Delivered' ? ' done' : ''}">
        <div class="track-dot"></div><div class="track-label">Delivered</div>
      </div>
    </div>

    <div class="order-items-list">
      <div th:each="item : ${order.items}" class="order-item-row">
        <span class="oi-title" th:text="${item.bookTitle}"></span>
        <span class="oi-qty">× <span th:text="${item.quantity}"></span></span>
        <span class="oi-price" th:text="'$' + #numbers.formatDecimal(item.priceAtPurchase * item.quantity, 1, 2)"></span>
      </div>
    </div>
  </div>

  <div th:if="${orders.empty}" class="empty-state">
    <div class="empty-icon">📦</div>
    <p>You haven't placed any orders yet.</p>
    <a th:href="@{/customer/books}" class="btn btn-primary">Browse Books</a>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
